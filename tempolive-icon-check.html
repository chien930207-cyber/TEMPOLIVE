<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>TEMPOLIVE 圖示檢查</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f5;--card:#fff;--text:#202020;--muted:#646464;--line:#ddd;--button:#202020;--on:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 16px 48px}main{max-width:800px;margin:auto}h1{font-size:28px;line-height:1.35;margin:5px 0 12px}h2{font-size:18px;margin:0 0 8px}p{margin:8px 0}.brand{font-size:13px;letter-spacing:.12em;font-weight:700}.muted,small{color:var(--muted)}small{font-size:13px}.card{border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--card);margin:16px 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}button{min-height:48px;padding:10px 18px;font:inherit;font-weight:650;background:var(--button);color:var(--on);border:1px solid var(--button);border-radius:12px;cursor:pointer;touch-action:manipulation}button.secondary{background:var(--card);color:var(--text);border-color:var(--line)}button:disabled{opacity:.5;cursor:wait}button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--muted);outline-offset:3px}#summary{font-size:20px;font-weight:700;line-height:1.5}.result-heading{display:flex;gap:14px;align-items:center}.art{width:56px;height:56px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#eee;flex:none}.pill{font-size:12px;font-weight:650;border:1px solid var(--line);border-radius:99px;padding:3px 9px;display:inline-block;margin:0 0 8px}.path{font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;word-break:break-word;color:var(--muted)}.strong{font-weight:700}details{border-top:1px solid var(--line);padding-top:12px;margin-top:16px}summary{min-height:44px;cursor:pointer}pre{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:350px;overflow:auto}textarea{width:100%;min-height:200px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.6 ui-monospace,monospace}a{color:inherit;text-underline-offset:3px}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#171717;--card:#232323;--text:#f4f4f4;--muted:#bbb;--line:#444;--button:#f4f4f4;--on:#202020}.art{background:#333}}@media(max-width:390px){body{padding:20px 12px}.card{padding:16px}h1{font-size:24px}.actions button{flex:1;padding:10px}}
</style></head><body><main>
<div class="brand">TEMPOLIVE</div><h1>圖示檢查</h1>
<p>直接檢查目前上線的 TEMPOLIVE，不修改任何歌單或設定。</p><p class="muted" id="where"></p>
<div class="actions"><button type="button" id="run">重新檢查</button><button type="button" class="secondary" id="copy" disabled>複製結果</button></div>
<section class="card" aria-labelledby="summary"><h2 id="summary" role="status" aria-live="polite">準備檢查</h2><p id="advice"></p><p class="path" id="checkedAt"></p></section>
<section class="card"><h2>檢查的網站</h2><p class="path" id="pageURL"></p><p id="pageStatus">準備檢查</p></section>
<div id="results"></div>
<section class="card" id="reportCard" hidden><h2>檢查結果</h2><p class="muted">複製這份結果回傳，就不需自己看程式碼。</p><textarea id="report" readonly aria-label="檢查結果"></textarea><details><summary>展開技術資訊</summary><pre id="technical"></pre></details></section>
<p class="muted"><small>此頁只讀取公開網頁與圖片，不執行節拍器、不讀取或清除歌單、不連接房間。結果不代表 Safari 分頁圖示已經刷新。</small></p>
</main><script>
'use strict';
const PAGE='https://chien930207-cyber.github.io/TEMPOLIVE/';
const $=id=>document.getElementById(id);
const urls=[];let report=null;
$('pageURL').textContent=PAGE;
$('where').textContent=location.protocol==='file:'?'目前以本機檔案開啟。若無法讀取，請將此檔案上傳到 index.html 同一層後，從網站開啟。':'只檢查圖示參照與圖片是否可讀取，不變更網站。';
const WORD={wait:'準備檢查',ok:'圖片可讀取',bad:'發現問題',unknown:'待確認'};
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
async function request(url,max){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{cache:'no-store',credentials:'omit',signal:c.signal,redirect:'follow'});const declared=Number(r.headers.get('content-length')||0);if(declared>max)throw Error('Response too large');const a=await r.arrayBuffer();if(a.byteLength>max)throw Error('Response too large');return {status:r.status,ok:r.ok,url:r.url,type:r.headers.get('content-type')||'',lastModified:r.headers.get('last-modified')||'',etag:r.headers.get('etag')||'',bytes:a};}finally{clearTimeout(t);}}
function fileKind(buffer){const a=new Uint8Array(buffer);if(a.length>=24&&[137,80,78,71,13,10,26,10].every((v,i)=>a[i]===v)){const d=new DataView(buffer);return {format:'PNG',width:d.getUint32(16),height:d.getUint32(20)};}if(a.length>=6&&a[0]===0&&a[1]===0&&a[2]===1&&a[3]===0){const d=new DataView(buffer),n=d.getUint16(4,true),sizes=[];if(n<1||n>256||6+n*16>a.length)return {format:'Invalid ICO'};for(let i=0;i<n;i++){const p=6+i*16,size=d.getUint32(p+8,true),offset=d.getUint32(p+12,true);if(!size||offset+size>a.length)return {format:'Invalid ICO'};sizes.push((a[p]||256)+'x'+(a[p+1]||256));}return {format:'ICO',sizes};}const text=new TextDecoder().decode(a.slice(0,2000)).trim();if(/<!doctype\s+html|<html[\s>]/i.test(text))return {format:'HTML'};if(/<svg[\s>]/i.test(text))return {format:'SVG'};return {format:'Unknown'};}
async function decodeImage(bytes,type){const blob=new Blob([bytes],{type}),url=URL.createObjectURL(blob);urls.push(url);return await new Promise(resolve=>{const im=new Image();let done=false;const end=v=>{if(done)return;done=true;clearTimeout(t);resolve(v);};const t=setTimeout(()=>end({decoded:false,preview:url}),4000);im.onload=()=>end({decoded:true,width:im.naturalWidth,height:im.naturalHeight,preview:url});im.onerror=()=>end({decoded:false,preview:url});im.src=url;});}
function show(item){const card=node('section',undefined,'card');const tag=node('span',item.kind==='touch'?'Apple 圖示':item.kind==='fallback'?'專案預設路徑':'分頁圖示','pill');card.append(tag);const row=node('div',undefined,'result-heading');if(item.preview&&item.decoded){const im=node('img',undefined,'art');im.src=item.preview;im.alt='TEMPOLIVE icon preview';row.append(im);}const box=node('div');box.append(node('h2',item.label),node('p',item.detail));row.append(box);card.append(row,node('p',item.href,'path'));if(item.file)card.append(node('p',(item.status?'HTTP '+item.status+' / ':'')+item.file.format+(item.file.sizes?' / '+item.file.sizes.join(', '):'')+(item.width?' / '+item.width+'x'+item.height:''),'path'));$('results').append(card);}
async function inspect(href,base,kind){const item={kind,href,label:WORD.unknown,detail:'',good:false};let u;try{u=new URL(href,base);}catch{item.detail='圖片路徑格式無效。';show(item);return item;}item.href=u.href;if(u.protocol==='data:'){item.href='data: ... (內嵌圖片)';item.inline=true;item.detail='網頁宣告的是內嵌圖片，不是獨立圖檔；舊版 Safari 需要額外確認相容性。';show(item);return item;}if(!['https:','http:'].includes(u.protocol)||u.origin!==new URL(PAGE).origin){item.detail='此圖示在其他網站或使用不同協定，本頁不自動讀取。';item.external=true;show(item);return item;}try{const r=await request(u.href,2*1024*1024);item.status=r.status;item.contentType=r.type;item.file=fileKind(r.bytes);if(!r.ok){item.label=WORD.bad;item.detail=r.status===404?'此圖片路徑回傳 404，需確認檔案名稱與發布位置。':'圖片請求回傳錯誤，不能視為已正常載入。';}else if(item.file.format==='HTML'){item.label=WORD.bad;item.detail='路徑回傳的是 HTML 網頁，不是圖片。';}else if(!['PNG','ICO','SVG'].includes(item.file.format)){item.label=WORD.bad;item.detail='未辨識為有效 PNG、ICO 或 SVG，請確認圖檔。';}else{const type=item.file.format==='PNG'?'image/png':item.file.format==='ICO'?'image/x-icon':'image/svg+xml';Object.assign(item,await decodeImage(r.bytes,type));item.good=item.decoded;item.label=item.good?WORD.ok:WORD.bad;item.detail=item.good?(item.file.format==='SVG'?'SVG 可讀取；但能顯示圖片不代表舊版 Safari 會將它用作分頁圖示。':'圖片回傳成功，且這台裝置可以解碼。請確認預覽是 TEMPOLIVE Logo。'):'伺服器回傳圖檔，但這台裝置無法解碼。';}}catch(e){item.error=e.name;item.detail=e.name==='AbortError'?'請求逾時，未能確認結果。':'請求未成功；可能是網路或跨網站讀取限制，不能直接判定是 404。';}show(item);return item;}
function finish(title,advice){$('summary').textContent=title;$('advice').textContent=advice;report.summary=title;report.advice=advice;const clean=JSON.parse(JSON.stringify(report,(key,value)=>key==='preview'?undefined:value));const text=['TEMPOLIVE icon check',report.time,'Page: '+PAGE,title,advice,report.page?.status?'Page HTTP: '+report.page.status:'Page request: '+(report.error||'unknown'),...(report.icons||[]).map(x=>[x.kind,x.href,x.status?'HTTP '+x.status:'',x.file?.format||'',x.label,x.detail].filter(Boolean).join(' | '))].join('\n');$('report').value=text;$('technical').textContent=JSON.stringify(clean,null,2);$('reportCard').hidden=false;$('copy').disabled=false;}
async function run(){if($('run').disabled)return;$('run').disabled=true;$('copy').disabled=true;$('results').replaceChildren();urls.splice(0).forEach(u=>URL.revokeObjectURL(u));$('reportCard').hidden=true;$('summary').textContent='正在檢查實際上線的圖示…';$('advice').textContent='';$('pageStatus').textContent=WORD.wait;report={time:new Date().toISOString(),pageURL:PAGE,userAgent:navigator.userAgent,location:location.href,icons:[]};$('checkedAt').textContent=report.time;try{const r=await request(PAGE,4*1024*1024);report.page={status:r.status,url:r.url,contentType:r.type,lastModified:r.lastModified,etag:r.etag};$('pageStatus').textContent='HTTP '+r.status+' / '+r.type;if(!r.ok){finish('網頁請求失敗','請先確認網址和 GitHub Pages 發布狀態。先回傳檢查結果，不需清除瀏覽資料。');return;}const text=new TextDecoder().decode(r.bytes);const match=text.match(/<head(?:\s[^>]*)?>([\s\S]*?)<\/head\s*>/i);if(!match){finish('無法確認網頁內容','回傳內容沒有可讀取的 HTML head，請回傳檢查結果。');return;}const doc=new DOMParser().parseFromString('<!doctype html><html><head>'+match[1]+'</head><body></body></html>','text/html');let base=r.url;const b=doc.querySelector('base[href]');if(b){try{base=new URL(b.getAttribute('href'),r.url).href;}catch{}}report.title=doc.title;report.build=doc.querySelector('meta[name="tempolive-build"]')?.content||'';const links=[...doc.querySelectorAll('link[href]')].map(l=>({rel:(l.getAttribute('rel')||'').toLowerCase().split(/\s+/),href:l.getAttribute('href')}));const items=links.filter(l=>l.rel.includes('icon')||l.rel.includes('apple-touch-icon')||l.rel.includes('apple-touch-icon-precomposed'));report.declared=items.length;for(const l of items.slice(0,12)){report.icons.push(await inspect(l.href,base,l.rel.includes('icon')?'favicon':'touch'));}if(!items.some(l=>l.rel.includes('icon'))){const c=node('section',undefined,'card');c.append(node('h2','網頁未宣告分頁圖示'),node('p','下方額外檢查同層的 favicon.ico，但即使檔案存在也不代表網頁已正確引用。'));$('results').append(c);report.icons.push(await inspect('favicon.ico',r.url,'fallback'));}const favicon=report.icons.filter(x=>x.kind==='favicon'),raster=favicon.filter(x=>x.good&&['PNG','ICO'].includes(x.file?.format));const allLocalErrors=favicon.filter(x=>!x.inline&&!x.external).some(x=>!x.good);if(raster.length){finish(allLocalErrors?'有可用圖示，也有失效參照':'已找到可讀取的 PNG / ICO',allLocalErrors?'請複製結果回傳，先排除路徑問題，不要只當成快取。':'確認下方預覽是正確 Logo。若分頁仍顯示 G，回傳結果與 iPadOS 版本；這時才進一步排查 Safari 選用圖示或舊快取。');}else if(favicon.some(x=>x.status===404)){finish('圖示參照路徑找不到檔案','已找到 404 的圖片路徑。先修正對應檔名或上傳位置，清快取並不會補回遺失檔案。');}else if(!favicon.length){finish('網頁沒有明確指定分頁圖示','只上傳圖片不足以確認分頁圖示。需核對線上 index.html 的引用。');}else if(favicon.every(x=>x.inline||x.file?.format==='SVG')){finish('目前仍只有內嵌圖或 SVG','沒有檢查到已宣告且可用的獨立 PNG / ICO。需確認圖示修正版的 index.html 是否發布到此網址。');}else{finish('圖示尚未通過讀取檢查','請將結果回傳，依實際失敗路徑再處理。這不是已確認的快取問題。');}}catch(e){report.error=e.name;$('pageStatus').textContent=e.name==='AbortError'?'請求逾時，未能確認結果。':'請求未成功；可能是網路或跨網站讀取限制，不能直接判定是 404。';finish('這個頁面也未能讀取網站','若目前開的是下載檔案，請先放到 TEMPOLIVE 的 index.html 同層並從網站開啟。已在網站上開啟卻仍失敗，請回傳此結果；不要清除歌單。');}finally{$('run').disabled=false;}}
$('run').addEventListener('click',run);$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('report').value);$('copy').textContent='已複製';}catch{$('report').focus();$('report').select();$('copy').textContent='已選取，請手動複製';}setTimeout(()=>$('copy').textContent='複製結果',3000);});run();
</script></body></html>
