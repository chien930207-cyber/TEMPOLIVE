<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMPOLIVE | 分頁圖示比對</title>
<link rel="icon" href="./tempolive-tab-r4.ico" type="image/x-icon">
<link rel="icon" href="./tempolive-tab-r4-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="./tempolive-tab-r4-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="./tempolive-tab-r4-48.png" type="image/png" sizes="48x48">
<style>
:root{color-scheme:light dark;--bg:#f5f5f5;--paper:#fff;--ink:#202020;--line:#ddd;--muted:#585858}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 system-ui,-apple-system,"PingFang TC",sans-serif}main{max-width:640px;margin:0 auto;padding:24px 18px 48px}h1{font-size:26px;line-height:1.35;margin:12px 0}h2{font-size:19px;margin:0 0 10px}p{margin:8px 0 16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;margin:18px 0}.lead{display:flex;gap:14px;align-items:center}.lead img{width:64px;height:64px;border-radius:14px}small,.muted{color:var(--muted)}a,button{touch-action:manipulation;font:inherit}button,a.button{display:block;min-height:50px;width:100%;border:1px solid var(--line);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;text-align:center;text-decoration:none;margin-top:12px;cursor:pointer}button:disabled{opacity:.5;cursor:default}.secondary{background:var(--paper);color:var(--ink)}a:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--muted);outline-offset:3px}textarea{width:100%;height:200px;font:13px/1.6 ui-monospace,monospace;padding:10px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;margin-top:12px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{background:var(--paper);color:var(--ink)}.choice button[aria-pressed=true]{border:3px solid var(--ink);font-weight:700}li{overflow-wrap:anywhere;font-size:15px;margin:8px 0}ul{padding-left:22px}@media(prefers-color-scheme:dark){:root{--bg:#181818;--paper:#222;--ink:#f4f4f4;--line:#484848;--muted:#bbb}}[hidden]{display:none!important}
</style></head><body><main>
<div class="lead"><img src="./tempolive-tab-r4-48.png" alt="TEMPOLIVE Logo"><div><small>TEMPOLIVE / tab-r4</small><h1>分頁圖示比對</h1></div></div>
<p>這頁與修正後的主網站使用同一組分頁圖示，但不載入節拍器程式。</p>
<section class="card"><h2>請看 Safari 分頁列</h2><p>看這個分頁名稱左邊的小圖示，不是上面的圖片預覽。網頁不能自動讀取 Safari 最終選用的分頁圖示，所以需要你確認。</p><div class="choice"><button id="seen-logo" type="button" aria-pressed="false">已顯示 Logo</button><button id="seen-g" type="button" aria-pressed="false">仍顯示 G</button></div><p id="choice-hint" class="muted" role="status"></p></section>
<section class="card"><h2>目前網站版本</h2><p id="status" role="status">正在核對網站與圖檔…</p><ul id="results"></ul><p class="muted">這些結果只能確認檔案及引用是否正確，不代表 Safari 已更新分頁圖示。</p><button type="button" id="copy" disabled>複製檢查結果</button><textarea id="report" readonly aria-label="檢查結果" hidden></textarea><a class="button" href="./?tab-icon=tab-r4">開啟 TEMPOLIVE</a></section>
<small>不讀寫歌單、不清除資料、不啟動聲音、不傳送結果到其他網站。</small>
</main><script>
'use strict';
const EXPECT={"tempolive-tab-r4.ico": "bc6c8876d0c66623754a2dde920201f7d923ca2b6e2f298a6c6e151f7992153a", "tempolive-tab-r4-16.png": "7a4bc7a6521b6d33e1b98825ae523aa7c393a45509fc5b1a2cbaf2de5c8d94b7", "tempolive-tab-r4-32.png": "536f6c73d136b6a4d6550e72a25613ef2521f7de2c25d6108a4f3962f7614445", "tempolive-tab-r4-48.png": "c0d6685eceab3e5c9947b427720f377941c282adb5972cc02ed6b82c6234c8ed"};
const byId=id=>document.getElementById(id);
const report={check:'TEMPOLIVE tab-r4',time:new Date().toISOString(),page:location.href,userAgent:navigator.userAgent,observedTab:'not selected',main:{},icons:[]};
function write(){byId('report').value=JSON.stringify(report,null,2);}
function row(text){const li=document.createElement('li');li.textContent=text;byId('results').append(li);}
for(const [id,value] of [['seen-logo','TEMPOLIVE logo'],['seen-g','G']])byId(id).addEventListener('click',()=>{report.observedTab=value;byId('seen-logo').setAttribute('aria-pressed',String(value!=='G'));byId('seen-g').setAttribute('aria-pressed',String(value==='G'));byId('choice-hint').textContent=value==='G'?'已記錄：獨立檢查分頁也是 G。請複製結果，不需重做私密模式測試。':'已記錄：這個獨立分頁已顯示 Logo。可再開啟 TEMPOLIVE 比較。';write();});
async function request(url,max=1500000){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);try{const response=await fetch(url,{cache:'no-store',signal:controller.signal,credentials:'omit'});const data=await response.arrayBuffer();if(data.byteLength>max)throw Error('response too large');return {response,data};}finally{clearTimeout(timer);}}
async function sha(data){if(!crypto.subtle)return null;return [...new Uint8Array(await crypto.subtle.digest('SHA-256',data))].map(x=>x.toString(16).padStart(2,'0')).join('');}
function decode(data,type){return new Promise(resolve=>{const img=new Image(),url=URL.createObjectURL(new Blob([data],{type}));let done=false;const finish=value=>{if(done)return;done=true;clearTimeout(timer);URL.revokeObjectURL(url);resolve(value);};const timer=setTimeout(()=>finish({decoded:false}),5000);img.onload=()=>finish({decoded:true,width:img.naturalWidth,height:img.naturalHeight});img.onerror=()=>finish({decoded:false});img.src=url;});}
async function run(){try{if(!/^https?:$/.test(location.protocol))throw Error('Please upload this page next to index.html and open its HTTPS URL.');const mainURL=new URL('./',location.href);const {response,data}=await request(mainURL);report.main.http=response.status;report.main.type=response.headers.get('content-type');if(!response.ok)throw Error('Main page HTTP '+response.status);const doc=new DOMParser().parseFromString(new TextDecoder().decode(data),'text/html');report.main.release=doc.querySelector('meta[name="tempolive-icon-release"]')?.content||'missing';report.main.appRelease=doc.querySelector('meta[name="tempolive-app-release"]')?.content||'missing';report.main.declared=[...doc.head.querySelectorAll('link[rel~="icon"]')].map(el=>new URL(el.getAttribute('href'),mainURL).href);row('主網站圖示版本：'+report.main.release+' / App：'+report.main.appRelease);
for(const [file,expected] of Object.entries(EXPECT)){const item={file};try{const url=new URL(file,mainURL);item.declared=report.main.declared.includes(url.href);const {response,data}=await request(url,200000);item.http=response.status;item.type=response.headers.get('content-type');if(response.ok){item.sha256=await sha(data);item.matchesRelease=item.sha256===expected;Object.assign(item,await decode(data,file.endsWith('.ico')?'image/x-icon':'image/png'));}}catch(error){item.error=error.name+': '+error.message;}report.icons.push(item);row(file+' / HTTP '+(item.http||'?')+' / '+(item.matchesRelease?'檔案版本正確':'未能確認版本')+' / '+(item.declared?'主網站有引用':'主網站未引用'));}
const ok=report.main.release==='tab-r4'&&report.icons.every(x=>x.http===200&&x.matchesRelease&&x.decoded&&x.declared);report.allFilesVerified=ok;byId('status').textContent=ok?'圖檔、版本與引用已核對。請看 Safari 分頁列是否顯示 Logo。':'上線版本或圖檔尚未全部核對通過。請複製結果，先不清除資料。';}catch(error){report.error=error.name+': '+error.message;byId('status').textContent='未能完成線上核對。請從 GitHub Pages 網址開啟此頁，並複製結果。';}finally{report.finished=true;write();byId('copy').disabled=false;}}
byId('copy').addEventListener('click',async()=>{write();try{await navigator.clipboard.writeText(byId('report').value);byId('copy').textContent='已複製';}catch{byId('report').hidden=false;byId('report').focus();byId('report').select();byId('copy').textContent='請複製下方內容';}});run();
</script></body></html>
